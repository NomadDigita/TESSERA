name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q tessera tests
      - run: python -m unittest discover -s tests -v
      - run: pip install --no-deps .
      - run: python -c "import tessera; print(tessera.__version__)"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tessera:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  production-services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: tessera
          POSTGRES_USER: tessera
          POSTGRES_PASSWORD: tessera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tessera -d tessera"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TESSERA_INTEGRATION_TESTS: "1"
      DATABASE_URL: postgresql://tessera:tessera@127.0.0.1:5432/tessera
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python -m unittest tests.test_production_services -v
