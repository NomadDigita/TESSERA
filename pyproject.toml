[project]
name = "tessera"
version = "0.5.0"
description = "Controlled multi-agent autonomous capital infrastructure"
requires-python = ">=3.10"

[project.scripts]
tessera = "tessera.server:serve"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tessera"]

[tool.setuptools.package-data]
tessera = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
