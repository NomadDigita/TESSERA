[project]
name = "tessera"
version = "0.7.0"
description = "Controlled multi-agent autonomous capital infrastructure"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<7",
]

[project.scripts]
tessera = "tessera.server:serve"
tessera-worker = "tessera.worker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tessera"]

[tool.setuptools.package-data]
tessera = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
